name: Refresh CV PDFs

# Keeps public/downloads in step with src/data/resume.ts so the PDF downloads never go stale.
on:
  push:
    branches: [main]
    paths:
      - 'src/data/**'
      - 'src/lib/cv.ts'
      - 'src/pages/cv/**'
      - 'src/pages/CvPage*'
      - 'scripts/build-cv-pdfs.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run cv:pdf
      - name: Commit refreshed PDFs
        run: |
          if git diff --quiet -- public/downloads; then
            echo "PDFs already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/downloads
            git commit -m "Refresh CV PDFs"
            git push
          fi
